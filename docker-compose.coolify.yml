# ──────────────────────────────────────────────────────────────────────
#  OmniRoute — Coolify compose (self-hosted gx10 deployment)
# ──────────────────────────────────────────────────────────────────────
#
#  Why this file exists next to docker-compose.yml: Coolify's compose build
#  pack cannot pass `--profile`, so the profile-based upstream file cannot
#  express "exactly these services" to it. This file IS the selection —
#  upstream's production shape (docker-compose.prod.yml: runner-cli + Redis)
#  minus the chatgpt-web-codex-browser sidecar, which only web-cookie
#  ChatGPT/Codex providers need and this deployment does not run.
#
#  Written for COOLIFY'S compose dialect, not vanilla compose:
#    - No container_name, no explicit volume `name:` — Coolify overrides
#      container names to <service>-<uuid> and uuid-prefixes named volumes
#      (verified: an explicit `name:` here was silently ignored).
#    - Intra-stack DNS is by service name (redis:6379) on the project network.
#    - ${VAR} resolves from the resource's synced env at deploy; an unsynced
#      var becomes silently blank, so every ${VAR} below must exist in env.
#
#  The bind-mount set mirrors the live application container EXACTLY
#  (docker inspect, 2026-08-14): the CLI identity/auth state for codex,
#  claude, cursor, and opencode lives on the host and is bound into the
#  container. Omitting these yields a healthy-looking gateway whose
#  CLI-synthesis providers are silently deauthed.
#
#  Operational config (secrets, provider toggles, NODE_OPTIONS) lives in
#  Coolify's env manager, not here. Only topology-owned values are pinned.
# ──────────────────────────────────────────────────────────────────────

services:
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    restart: unless-stopped
    # Not published to the host: the gateway reaches it as redis:6379 on the
    # stack network. Publishing an unauthenticated Redis is how LAN-exposed
    # instances happen (see the warning in upstream docker-compose.yml).
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    build:
      context: .
      # runner-cli to match both upstream's prod snapshot and the image the
      # previous application-shaped deployment ran (default Dockerfile target).
      target: runner-cli
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=20128
      - DASHBOARD_PORT=20128
      - LIVE_WS_PORT=20132
      - LIVE_WS_HOST=0.0.0.0
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
    ports:
      # Parameterized so a candidate stack smokes beside the live gateway
      # (e.g. 20230/20232) and takes over 20128/20132 at cutover by changing
      # env only — no compose edit, no rebuild.
      - "${OMNIROUTE_HOST_PORT}:20128"
      - "${OMNIROUTE_WS_HOST_PORT}:20132"
    volumes:
      - omniroute-data:/app/data
      # CLIProxyAPI auth state (token store the gateway reads at
      # /home/node/.cli-proxy-api — a named volume on the live app too).
      - cliproxy-auth:/home/node/.cli-proxy-api
      # ── Host CLI identity/auth mounts — exact mirror of the live app ──
      # Container user is `node`; CLIs resolve $HOME=/home/node.
      - /home/ken/.codex:/home/node/.codex
      - /home/ken/.claude:/home/node/.claude
      - /home/ken/.cursor:/home/node/.cursor
      - /home/ken/.opencode:/home/node/.opencode
      - /home/ken/.config/cursor:/home/node/.config/cursor
      - /home/ken/.config/opencode:/home/node/.config/opencode
      - /home/ken/.local/share/opencode:/home/node/.local/share/opencode
      - /home/ken/.local/state:/home/node/.local/state
      # cursor Agent CLI at its host path — CURSOR_DATA_DIR and PATH env
      # point at /home/ken/..., so these keep their host-side paths.
      - /home/ken/.local/share/cursor-agent:/home/ken/.local/share/cursor-agent
      - /home/ken/.local/bin:/home/ken/.local/bin:ro
    healthcheck:
      # Mirrors the image's own HEALTHCHECK (Dockerfile copies
      # scripts/dev/healthcheck.mjs to /app/healthcheck.mjs).
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  omniroute-data:
  redis-data:
  cliproxy-auth:
